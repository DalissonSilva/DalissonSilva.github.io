  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();

              chunks.push(value);

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

      // anchors, which closest()/IDL .target get wrong.

            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +

              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +

      // ids) before wrapping — same escape level as every sibling JSON island.

        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';

      // would push the parser into quirks mode. DOMParser always emits a <head>

      // attributes through, so match the full opening tag.

      }

    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).

        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);

        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.

          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();

        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);

        old.replaceWith(s);

      }

      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    navigate();

y: swap;\n  src: url(\"9dcea8b3-705d-4377-a1a2-94fbce0ec841\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"695b8e11-b026-4649-bef8-224a67161e7a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"f500f23a-c647-495c-82f6-61ef38e3325d\"><\u002Fscript>\n<style>\n  :root {\n    --bg: #F4EFE4;\n    --bg-2: #ECE5D6;\n    --surface: #FBF8F1;\n    --surface-2: #F1EBDD;\n    --line: rgba(38,33,24,0.14);\n    --line-strong: rgba(38,33,24,0.26);\n    --text: #221E17;\n    --text-dim: #5B554A;\n    --text-faint: #918A79;\n    --blue: #2C6E73;\n    --blue-soft: rgba(44,110,115,0.12);\n    --green: #1C6B4F;\n    --green-soft: rgba(28,107,79,0.12);\n    --amber: #A9762A;\n    --red: #A8472B;\n    --font-display: \"Newsreader\", Georgia, serif;\n    --font-body: \"Archivo\", system-ui, sans-serif;\n    --font-mono: \"IBM Plex Mono\", ui-monospace, monospace;\n  }\n\n  html, body { margin: 0; padding: 0; background: #26221b; color: var(--text); font-family: var(--font-body); }\n\n  deck-stage section {\n    width: 1920px; height: 1080px;\n    background: var(--bg);\n    color: var(--text);\n    position: relative;\n    overflow: hidden;\n    box-sizing: border-box;\n    font-family: var(--font-body);\n  }\n\n  /* ───────────────────── Shared chrome ───────────────────── */\n  .slide-frame {\n    position: absolute; inset: 56px 80px 56px 80px;\n    display: flex; flex-direction: column;\n  }\n  .slide-head {\n    display: flex; align-items: center; justify-content: space-between;\n    padding-bottom: 28px; margin-bottom: 36px;\n    border-bottom: 1px solid var(--line);\n  }\n  .crumb {\n    display: flex; align-items: center; gap: 14px;\n    font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.08em;\n    color: var(--text-faint); text-transform: uppercase;\n  }\n  .crumb .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 12px var(--blue); }\n  .page-no { font-family: var(--font-mono); font-size: 13px; color: var(--text-faint); letter-spacing: 0.1em; }\n  .grid-bg {\n    position: absolute; inset: 0; pointer-events: none;\n    background-image:\n      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);\n    background-size: 80px 80px;\n    mask-image: radial-gradient(ellipse at 50% 40%, black 30%, transparent 80%);\n  }\n  .glow {\n    position: absolute; pointer-events: none; filter: blur(120px); opacity: 0.4;\n  }\n  .glow.blue  { background: radial-gradient(circle, var(--blue) 0%, transparent 60%); }\n  .glow.green { background: radial-gradient(circle, var(--green) 0%, transparent 60%); }\n\n  h1, h2, h3 { font-family: var(--font-display); font-weight: 500; margin: 0; letter-spacing: -0.02em; }\n  .eyebrow {\n    font-family: var(--font-mono); font-size: 14px;\n    color: var(--blue); text-transform: uppercase; letter-spacing: 0.14em;\n  }\n  .mono { font-family: var(--font-mono); }\n  .text-dim { color: var(--text-dim); }\n  .text-faint { color: var(--text-faint); }\n\n  /* ───────────────────── 01 · COVER ───────────────────── */\n  .cover { display: grid; grid-template-columns: 1.05fr 0.95fr; height: 100%; }\n  .cover .left {\n    padding: 96px 80px 80px 96px;\n    display: flex; flex-direction: column; justify-content: space-between;\n    position: relative;\n  }\n  .cover .brandline {\n    display: flex; align-items: center; gap: 14px;\n    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--text-faint);\n  }\n  .cover .brandline .pill { padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text-dim); }\n  .cover h1 {\n    font-size: 132px; line-height: 0.94; font-weight: 500;\n    letter-spacing: -0.035em;\n  }\n  .cover h1 .accent { color: var(--green); font-style: italic; font-weight: 400; }\n  .cover .tagline {\n    margin-top: 40px; max-width: 640px;\n    font-size: 22px; line-height: 1.45; color: var(--text-dim);\n  }\n  .cover .meta {\n    display: grid; grid-template-columns: repeat(3, auto);\n    gap: 56px;\n    font-family: var(--font-mono); font-size: 13px;\n    color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em;\n  }\n  .cover .meta b { display: block; color: var(--text); font-weight: 500; font-family: var(--font-body); font-size: 16px; text-transform: none; letter-spacing: 0; margin-top: 6px; }\n  .cover .right {\n    position: relative;\n    background: linear-gradient(135deg, #131c33 0%, #0a1020 100%);\n    overflow: hidden;\n  }\n  .cover .right::before {\n    content: \"\"; position: absolute; inset: 0;\n    background:\n      radial-gradient(circle at 20% 20%, var(--blue-soft), transparent 50%),\n      radial-gradient(circle at 80% 80%, var(--green-soft), transparent 50%);\n  }\n  .portrait-wrap {\n    position: absolute; inset: 80px 80px 80px 80px;\n    border-radius: 6px; overflow: hidden;\n    border: 1px solid var(--line-strong);\n    box-shadow: 0 30px 80px rgba(0,0,0,0.5);\n  }\n  .portrait-wrap img {\n    width: 100%; height: 100%; object-fit: cover; object-position: center top;\n    filter: contrast(1.02) saturate(0.95);\n  }\n  .portrait-tag {\n    position: absolute; left: 100px; bottom: 100px; z-index: 3;\n    padding: 18px 22px;\n    background: rgba(10,16,32,0.7); backdrop-filter: blur(12px);\n    border: 1px solid var(--line-strong);\n    border-radius: 4px;\n    font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\n    letter-spacing: 0.12em; text-transform: uppercase;\n    max-width: 320px;\n  }\n  .portrait-tag .big { display: block; color: var(--text); font-size: 18px; letter-spacing: 0; text-transform: none; font-family: var(--font-body); margin-top: 6px; }\n\n  .cover .corner {\n    position: absolute; top: 56px; right: 64px;\n    display: flex; align-items: center; gap: 10px;\n    font-family: var(--font-mono); font-size: 12px; color: var(--text-faint);\n    letter-spacing: 0.16em; text-transform: uppercase; z-index: 4;\n  }\n  .cover .corner .live { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 12px var(--green); }\n\n  /* ───────────────────── Generic two-col ───────────────────── */\n  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; flex: 1; min-height: 0; }\n  .col-card {\n    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n    padding: 40px 44px; position: relative; display: flex; flex-direction: column;\n  }\n  .col-card .label {\n    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--text-faint);\n    display: flex; align-items: center; gap: 10px;\n    margin-bottom: 24px;\n  }\n  .col-card.before .label::before { content: \"\"; width: 8px; height: 8px; background: var(--red); border-radius: 1px; transform: rotate(45deg); }\n  .col-card.after .label::before  { content: \"\"; width: 8px; height: 8px; background: var(--green); border-radius: 50%; }\n  .col-card h3 { font-size: 32px; margin-bottom: 28px; line-height: 1.15; }\n  .bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }\n  .bullets li {\n    padding-left: 28px; position: relative; font-size: 18px; line-height: 1.45; color: var(--text-dim);\n  }\n  .bullets li::before {\n    content: \"\"; position: absolute; left: 0; top: 11px;\n    width: 14px; height: 1px; background: var(--text-faint);\n  }\n  .after .bullets li::before { background: var(--green); height: 2px; box-shadow: 0 0 8px rgba(31,203,143,0.5); }\n\n  /* ───────────────────── Headings (slide title) ───────────────────── */\n  .h-title { font-size: 64px; line-height: 1.05; max-width: 1400px; }\n  .h-sub { color: var(--text-dim); font-size: 20px; margin-top: 16px; max-width: 1000px; }\n\n  /* ───────────────────── 02 · ABOUT ───────────────────── */\n  .about-grid {\n    display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 32px; flex: 1; margin-top: 16px;\n  }\n  .info-card {\n    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n    padding: 32px 32px; display: flex; flex-direction: column;\n  }\n  .info-card .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-faint); }\n  .info-card .v { margin-top: 14px; font-size: 24px; color: var(--text); line-height: 1.25; }\n  .stack-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }\n  .stack-pills span {\n    font-family: var(--font-mono); font-size: 12px; padding: 6px 10px;\n    border: 1px solid var(--line-strong); border-radius: 4px; color: var(--text-dim);\n  }\n  .exp-band { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 28px; }\n  .exp-card {\n    background: linear-gradient(135deg, rgba(31,203,143,0.07), transparent 60%), var(--surface);\n    border: 1px solid var(--line); border-left: 2px solid var(--green); border-radius: 6px;\n    padding: 24px 30px; display: flex; flex-direction: column; gap: 10px;\n  }\n  .exp-card .exp-k {\n    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;\n    color: var(--green); display: flex; align-items: center; gap: 10px;\n  }\n  .exp-card .exp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }\n  .exp-card .exp-t { font-family: var(--font-display); font-size: 21px; line-height: 1.2; color: var(--text); }\n  .exp-card .exp-d { font-size: 15px; line-height: 1.5; color: var(--text-dim); }\n\n  /* ───────────────────── 03 · CONTEXT ───────────────────── */\n  .ctx-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; flex: 1; min-height:0; }\n  .org-tree {\n    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n    padding: 40px; position: relative;\n    display: flex; flex-direction: column; gap: 22px;\n  }\n  .tree-node {\n    background: var(--bg-2); border: 1px solid var(--line);\n    padding: 14px 18px; border-radius: 4px;\n    font-size: 16px; color: var(--text-dim);\n  }\n  .tree-node.root { border-color: var(--blue); color: var(--text); }\n  .tree-node.area { border-color: var(--green); background: linear-gradient(90deg, rgba(31,203,143,0.08), transparent); color: var(--text); }\n  .tree-node .pre { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); margin-right: 12px; }\n  .sub-areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-left: 40px; margin-top: 4px; }\n  .sub-areas .tree-node { font-size: 14px; padding: 14px; text-align: center; }\n  .indent { padding-left: 40px; }\n  .indent-2 { padding-left: 80px; }\n\n  .ctx-stats { display: flex; flex-direction: column; gap: 16px; }\n  .stat-row {\n    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n    padding: 22px 26px; display: flex; align-items: baseline; justify-content: space-between;\n  }\n  .stat-row .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint); }\n  .stat-row .value { font-family: var(--font-display); font-size: 28px; color: var(--text); }\n  .regulator-row {\n    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n    padding: 22px 26px;\n  }\n  .regulator-row .label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 12px; }\n  .reg-chips { display: flex; flex-wrap: wrap; gap: 8px; }\n  .reg-chips span { padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 4px; font-family: var(--font-mono); font-size: 13px; color: var(--text); }\n\n  .net-cell {\n    display: flex; align-items: flex-start; gap: 10px;\n    padding: 10px 12px; background: var(--bg-2);\n    border: 1px solid var(--line); border-radius: 4px;\n  }\n  .net-cell .n {\n    font-family: var(--font-display); font-size: 22px; font-weight: 600;\n    color: var(--green); line-height: 1; min-width: 22px;\n  }\n  .net-cell b {\n    font-family: var(--font-body); font-weight: 500; font-size: 13px;\n    color: var(--text); display: block; line-height: 1.25;\n  }\n  .net-cell span {\n    font-family: var(--font-mono); font-size: 10px;\n    color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase;\n    display: block; margin-top: 2px;\n  }\n\n  /* ───────────────────── 04 · PILLARS OVERVIEW ───────────────────── */\n  .pillars-grid {\n    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr;\n    gap: 24px; flex: 1; min-height: 0;\n  }\n  .pillar-card {\n    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n    padding: 32px; position: relative; display: flex; flex-direction: column;\n    transition: border-color 0.2s;\n  }\n  .pillar-card:hover { border-color: var(--blue); }\n  .pillar-card .num {\n    font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); letter-spacing: 0.16em;\n  }\n  .pillar-card .name { font-family: var(--font-display); font-size: 26px; margin: 12px 0 16px; line-height: 1.15; }\n  .pillar-card .desc { font-size: 15px; color: var(--text-dim); line-height: 1.5; flex: 1; }\n  .pillar-card .maturity {\n    display: flex; align-items: center; gap: 10px; margin-top: 20px;\n    font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); letter-spacing: 0.12em; text-transform: uppercase;\n  }\n  .maturity-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }\n  .maturity-bar .fill { height: 100%; background: var(--green); }\n  .pillar-card .icon {\n    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;\n    border: 1px solid var(--line-strong); border-radius: 4px;\n    position: absolute; top: 32px; right: 32px;\n  }\n  .pillar-card .icon svg { width: 20px; height: 20px; stroke: var(--blue); fill: none; stroke-width: 1.5; }\n\n  /* ───────────────────── 05 · ARCH DIAGRAM ───────────────────── */\n  .arch-canvas {\n    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;\n    padding: 56px; display: flex; flex-direction: column; gap: 24px; position: relative;\n  }\n  .arch-row { display: grid; grid-template-columns: 180px 1fr; gap: 32px; align-items: center; }\n  .arch-row .stage {\n    padding: 18px 22px; border-radius: 4px;\n    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;\n    text-align: center;\n  }\n  .stage.src   { background: rgba(255,255,255,0.04); color: var(--text-dim); border: 1px solid var(--line-strong); }\n  .stage.bronze { background: linear-gradient(135deg, #6b3a1f, #43230f); color: #f6d2a8; border: 1px solid #8a5530; }\n  .stage.silver { background: linear-gradient(135deg, #4a5366, #2b3242); color: #d6dceb; border: 1px solid #6b7689; }\n  .stage.gold   { background: linear-gradient(135deg, #7a5c1f, #463411); color: #f7df9c; border: 1px solid #a37e2c; }\n  .stage.bi     { background: linear-gradient(135deg, var(--blue), #2d5cc7); color: white; border: 1px solid var(--blue); }\n  .arch-detail {\n    background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px;\n    padding: 18px 24px; font-size: 15px; color: var(--text-dim); dis
